<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<title>TSL Scoreboard</title>
	<meta name="description" content="Score and time saber bouts for The Saber Legion." />
	<meta name="theme-color" content="#0b0c0e" />
	<link rel="preload" href="assets/fonts/big-shoulders.woff2" as="font" type="font/woff2" crossorigin />
	<link rel="manifest" href="manifest.webmanifest" />
	<link rel="icon" href="assets/saber-icon-192.png" />
	<link rel="apple-touch-icon" href="assets/saber-icon.png" />
	<link rel="stylesheet" href="css/style.css" />
	<script type="module" src="js/app.js"></script>
</head>
<body>
	<noscript>This scoreboard needs JavaScript turned on.</noscript>
	<div id="app"></div>

	<dialog id="settings" class="sheet"></dialog>
	<dialog id="history" class="sheet"></dialog>
	<dialog id="pool" class="sheet"></dialog>
	<dialog id="confirm" class="confirm">
		<form method="dialog">
			<p id="confirm-text"></p>
			<div class="row">
				<button value="cancel" class="btn">Cancel</button>
				<button value="ok" class="btn danger" id="confirm-ok">OK</button>
			</div>
		</form>
	</dialog>
</body>
</html>
