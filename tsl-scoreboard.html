:root {
	--ink: #0b0c0e;
	--panel: #16181c;
	--panel-2: #20232a;
	--line: #2f333b;
	--text: #f2f3f5;
	--muted: #8e949d;
	--gold: #d6a83e;
	--gold-dim: #8a6a22;
	--go: #22a559;
	--stop: #e8770c;
	--danger: #e5383b;
	--radius: 16px;
	--display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', Impact, sans-serif;
	--body: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
	--left: #2459e0;
	--right: #d42a3a;
	color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
	min-height: 100dvh;
	background:
		radial-gradient(120% 60% at 50% -10%, #1d2027 0%, transparent 60%),
		var(--ink);
	color: var(--text);
	font: 500 17px/1.35 var(--body);
	-webkit-tap-highlight-color: transparent;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
kbd {
	font: 700 0.68em var(--body);
	padding: 0 5px;
	border: 1px solid currentColor;
	border-radius: 4px;
	opacity: 0.5;
	vertical-align: 0.1em;
}
@media (hover: none) { kbd { display: none; } }

/* --- buttons --- */
.btn {
	min-height: 52px;
	padding: 8px 16px;
	border: 1px solid var(--line);
	border-radius: 12px;
	background: var(--panel-2);
	font-weight: 700;
	font-size: 17px;
	letter-spacing: 0.02em;
	text-transform: uppercase;
}
.btn:hover:not(:disabled) { background: #2a2e36; border-color: #454a54; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: 14px; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover:not(:disabled) { background: #c42528; }
.btn.wide { width: 100%; }
.row { display: flex; gap: 8px; }
.row > .btn { flex: 1; }
.row.wrap { flex-wrap: wrap; }
.row.wrap > .btn { flex: 1 1 180px; }

/* --- header --- */
.bar {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	padding: 10px 16px;
	border-bottom: 1px solid var(--gold-dim);
	background: linear-gradient(#000, #0f1013);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.emblem { width: 48px; height: 48px; flex: none; filter: drop-shadow(0 0 6px rgba(214,168,62,.25)); }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.org {
	font: 800 12px/1 var(--display);
	letter-spacing: 0.22em;
	text-transform: uppercase;
	color: var(--gold);
	white-space: nowrap;
}
.round-pill {
	border: 0;
	background: none;
	padding: 2px 0 0;
	text-align: left;
	font: 900 28px/1 var(--display);
	text-transform: uppercase;
	letter-spacing: 0.02em;
	white-space: nowrap;
}
.sd-tag {
	font: 700 12px/1 var(--body);
	letter-spacing: 0.08em;
	color: #fff;
	background: var(--danger);
	border-radius: 4px;
	padding: 3px 6px;
	vertical-align: 0.35em;
}
@media (max-width: 480px) { .round-pill .sd-tag { display: block; width: fit-content; margin-top: 4px; } }
.bar-actions { display: flex; gap: 6px; }
.bar .btn { background: transparent; border-color: #353943; }
.bar .btn:hover { border-color: var(--gold); color: var(--gold); background: transparent; }

/* --- control view --- */
.dg { display: inline-block; width: 0.56em; text-align: center; }
.control {
	max-width: 720px;
	margin: 0 auto;
	padding: 14px 16px 32px;
	display: flex;
	flex-direction: column;
	gap: 12px;
}
.match-line {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 4px;
	border: 0;
	background: none;
	padding: 0;
}
.division {
	display: flex;
	align-items: center;
	gap: 12px;
	width: 100%;
	font: 900 30px/1 var(--display);
	text-transform: uppercase;
	letter-spacing: 0.14em;
	color: var(--gold);
}
.division::before, .division::after {
	content: "";
	flex: 1;
	height: 2px;
	background: linear-gradient(90deg, transparent, var(--gold-dim));
}
.division::after { background: linear-gradient(90deg, var(--gold-dim), transparent); }
.rules {
	font-size: 13px;
	font-weight: 700;
	text-transform: uppercase;
	letter-spacing: 0.12em;
	color: var(--muted);
}
.clock {
	position: relative;
	width: 100%;
	padding: 6px 0 2px;
	border: 1px solid var(--line);
	border-radius: var(--radius);
	background: linear-gradient(#121418, #070809);
	box-shadow: inset 0 2px 12px rgba(0,0,0,.6);
	font: 800 clamp(64px, 21vw, 150px)/1 var(--display);
	white-space: nowrap;
	font-variant-numeric: tabular-nums;
	letter-spacing: 0.01em;
	color: #fff;
}
.clock small { font-size: 0.5em; color: var(--muted); }
.clock.running { border-color: var(--go); box-shadow: inset 0 2px 12px rgba(0,0,0,.6), 0 0 0 1px var(--go), 0 0 28px -6px var(--go); }
.clock.up { color: var(--danger); border-color: var(--danger); }
.clock.untimed { font-size: clamp(40px, 12vw, 80px); padding: 22px 0 18px; color: var(--danger); border-color: var(--danger); text-transform: uppercase; }
.status-row { text-align: center; min-height: 30px; margin-top: -4px; }
.status { font: 800 26px/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.06em; }
.status.muted { color: var(--muted); font-size: 18px; letter-spacing: 0.2em; }
.status.alert { color: var(--danger); }
.status.win { color: var(--text); }
.status-sub { margin-top: 6px; font: 700 18px/1 var(--display); text-transform: uppercase; letter-spacing: 0.16em; color: var(--gold); }
.status.win strong { color: var(--c); filter: brightness(1.45) saturate(1.2); font-size: 1.25em; font-weight: 900; }

.fighters {
	display: grid;
	grid-template-columns: 1fr 0.72fr 1fr;
	gap: 10px;
}
.fighter { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.score-btn {
	position: relative;
	overflow: hidden;
	display: flex;
	flex-direction: column;
	align-items: center;
	width: 100%;
	min-height: 220px;
	padding: 12px 6px 10px;
	border: 0;
	border-radius: var(--radius);
	background:
		linear-gradient(160deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 38%),
		linear-gradient(180deg, transparent 55%, rgba(0,0,0,.28)),
		var(--c, var(--panel-2));
	color: #fff;
	box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 6px 18px -8px var(--c, #000);
	transition: transform .06s, filter .06s;
}
.score-btn::after {
	/* a thin saber-stroke highlight across the top corner */
	content: "";
	position: absolute;
	inset: -40% auto auto -30%;
	width: 160%;
	height: 2px;
	background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
	transform: rotate(-24deg);
	transform-origin: left;
	pointer-events: none;
}
.score-btn:active { filter: brightness(1.18); transform: scale(0.97); }
.simul .score-btn {
	background: linear-gradient(180deg, #23262d, #17191d);

function recordScores(averages, winner) {
	const scores = averages.map(a => Math.round(a));
	if (winner === null) {
		const level = Math.round((averages[0] + averages[1]) / 2);
		return [level, level];
	}
	if (scores[winner] <= scores[1 - winner]) {
		// A big gap between the average and the votes: the loser goes one below the winner.
		scores[winner] = Math.max(scores[winner], 1);
		scores[1 - winner] = scores[winner] - 1;
	}
	return scores;
}

/**
 * What the judges reported. Each judge who gave both scores casts a vote for
 * the fighter they scored higher (none if level); the winner comes from the
 * votes, so one judge with wildly different numbers can't swing it. The
 * averages are for the record.
 */
function tallyResult(s) {
	const done = s.tally.judges.filter(j => j.every(v => v !== null));
	const avg = i => (done.length ? Math.round(done.reduce((sum, j) => sum + j[i], 0) / done.length * 10) / 10 : 0);
	const votes = [0, 1].map(i => done.filter(j => j[i] > j[1 - i]).length);
	const averages = [avg(0), avg(1)];
	return {
		reported: done.length,
		averages,
		votes,
		scores: recordScores(averages, votes[0] === votes[1] ? null : votes[0] > votes[1] ? 0 : 1),
	};
}

/** Why a card was given, from the conduct rules (3.03, 3.04, 4.03, 5.07-7, 5.11-5). */
const CARD_REASONS = ['Breach of conduct', 'Intentional ring out', 'Foot fault', 'Excessive force', 'Cornerstone', 'Other'];

const CARD_NAMES = { yellow: 'Yellow', red: 'Red', black: 'Black' };

const noCards = () => ({ yellow: 0, red: 0, black: 0 });

const hasCards = f => f.cards.yellow + f.cards.red + f.cards.black > 0;

function fighter(color) {
	return { name: COLORS[color].label, subtitle: '', color, score: 0, wins: 0, cards: noCards() };
}

function emptyPool() {
	return { fighters: [], bouts: [], active: null, nextId: 1, lastFinish: null };
}

function initialState(settings = DEFAULT_SETTINGS) {
	return {
		version: 2,
		/** The pool being run: fighters, the round-robin bouts and their results. Like settings, undo never rolls it back. */
		pool: emptyPool(),
		round: 1,
		fighters: [fighter('blue'), fighter('red')],
		simul: 0,
		/** Points each simul actually took from [left, right], so removing it gives back the same. */
		simulPenalties: [],
		suddenDeath: false,
		/** Side that took a black card (or didn't show) and forfeits the bout, or null. */
		forfeit: null,
		/** The forfeit was a no-show. */
		noShow: false,
		/** Time is up but the last exchange is still being fought. */
		finalExchange: false,
		/** Unity: each judge's silent tally [left, right], kept off the screens until published. Null until entered. */
		tally: emptyTally(),
		/** Sudden death: the table saw an attempt to score, so the attempt clock is cleared. */
		attemptMade: false,
		/** An injured fighter's medical hold, counted down beside the paused bout clock: { startedAt }, or null (3.05-5). */
		medical: null,
		/** Fighters switch corners when the first reaches half the winning score (5.12): the call was made, and is waiting to be cleared. */
		sidesCalled: false,
		sidesDue: false,
		/** Tag Team, after a simul: which teams paid a point to keep their fighter in. Null when no switch is due. */
		tagSwitch: null,
		/** Time left when a fighter reached the winning score, so undoing that point can give it back. */
		stoppedAtTarget: null,
		showWinner: true,
		/** Time left as of the last start/pause. */
		remaining: settings.duration,
		/** Epoch ms of the last start/resume, or null while paused. */
		startedAt: null,
		settings: { ...settings },
		/** Every scoring action this match, oldest first. */
		log: [],
		/** One entry per finished round. */
		rounds: [],
	};
}

/** Fills in anything missing from a saved state (older saves, new settings). */
function normalize(saved) {
	if (!saved || saved.version !== 2) return initialState();
	const base = initialState();
	return {
		...base,
		...saved,
		settings: { ...DEFAULT_SETTINGS, ...saved.settings, customDivisions: [...(saved.settings?.customDivisions ?? [])] },
		fighters: [0, 1].map(i => ({ ...base.fighters[i], ...saved.fighters?.[i] })),
		pool: { ...emptyPool(), ...saved.pool },
	};
}

function timeLeft(s, now = Date.now()) {
	const elapsed = s.startedAt === null ? 0 : now - s.startedAt;
	return Math.max(s.remaining - elapsed, 0);
}

/** A timed sudden death longer than this needs an attempt to score in its first 30 seconds (Rule 5.04-6). */
const ATTEMPT_WINDOW = 30_000;

/** Time left to attempt a score in sudden death, or null when no attempt is being asked for. */
function attemptLeft(s, now = Date.now()) {
	const long = s.settings.tiebreakerDuration > ATTEMPT_WINDOW;
	if (!s.suddenDeath || s.attemptMade || !long || !s.settings.liveScore || leader(s) !== null || s.forfeit !== null) return null;
	const left = timeLeft(s, now);
	if (left === 0 && !isRunning(s) && s.remaining === 0) return null;
	return Math.max(left - (s.settings.tiebreakerDuration - ATTEMPT_WINDOW), 0);
}

/** Length of the medical hold (Rule 3.05-5). */
const MEDICAL_HOLD = 180_000;
const medicalLeft = (s, now = Date.now()) => (s.medical ? Math.max(MEDICAL_HOLD - (now - s.medical.startedAt), 0) : 0);

const isRunning = s => s.startedAt !== null;

/** Sudden death with no clock: it ends when the Marshal names a winner. */
const isUntimed = s => s.suddenDeath && s.settings.tiebreakerDuration === 0 && s.remaining > 0;

/** Stands in for the clock reading while sudden death is untimed. */
const UNTIMED_REMAINING = 1;
const isTimeUp = (s, now) => timeLeft(s, now) === 0;
const hasStarted = s => isRunning(s) || s.remaining !== s.settings.duration ||
	s.fighters.some(f => f.score) || s.simul > 0;

/** Index of the fighter ahead on points, or null on a tie. */
function leader(s) {
	const [a, b] = s.fighters;
	// A black card forfeits the bout to the other fighter.
	if (s.forfeit !== null && s.forfeit !== undefined) return 1 - s.forfeit;
	// A published Unity result is decided by the judges' votes, not the averages.
	if (s.tally?.published) {
		const [x, y] = s.tally.votes;
		if (x !== y) return x > y ? 0 : 1;
		return s.tally.tieWinner ?? null;
	}
	if (a.score === b.score) return null;
	return a.score > b.score ? 0 : 1;
}

/** Index of the fighter who has won the match, or null. */
/** The bout is over and has a result a pool can record: time is up, no final exchange pending, and a winner. */
function boutDecided(s, now = Date.now()) {
	if (timeLeft(s, now) !== 0 || s.finalExchange || isUntimed(s)) return false;
	if (!s.settings.liveScore && !s.tally.published) return false;
	return leader(s) !== null;
}

/** Scores to record for the bout: the live scores, or the judges' recorded scores in Unity. */
const boutScores = s => (s.settings.liveScore ? s.fighters.map(f => f.score) : tallyResult(s).scores);

/** A fighter who fights back to back gets this long to rest. */
const REST_TIME = 60_000;

/** Pool bout is loaded and a fighter in it just fought: the fighters resting and the time left, or null. */
function restLeft(s, now = Date.now()) {
	const last = s.pool.lastFinish;
	if (s.pool.active === null || !last || hasStarted(s)) return null;
	const ids = s.fighters.map(f => f.poolId).filter(id => last.ids.includes(id));
	const left = Math.max(REST_TIME - (now - last.at), 0);
	return ids.length && left > 0 ? { ids, left } : null;
}

/**
 * Pool standings: wins, then points for, then fewest points against (Rule 6.02c-4).
 * Each row is { id, name, played, wins, losses, pointsFor, pointsAgainst }.
 */
function poolStandings(pool) {
	const rows = new Map(pool.fighters.map(f => [f.id, { id: f.id, name: f.name, played: 0, wins: 0, losses: 0, pointsFor: 0, pointsAgainst: 0 }]));
	for (const b of pool.bouts) {
		if (!b.result) continue;
		const [x, y] = [rows.get(b.a), rows.get(b.b)];
		if (!x || !y) continue;
		const [sa, sb] = b.result.scores;
		x.played++; y.played++;
		x.pointsFor += sa; x.pointsAgainst += sb;
		y.pointsFor += sb; y.pointsAgainst += sa;
		if (b.result.winner === b.a) { x.wins++; y.losses++; }
		else if (b.result.winner === b.b) { y.wins++; x.losses++; }
	}
	return [...rows.values()].sort((p, q) => q.wins - p.wins || q.pointsFor - p.pointsFor || p.pointsAgainst - q.pointsAgainst);
}

/** Every pairing once, ordered so fighters rest between bouts (the circle method). Returns [a, b] id pairs. */
function roundRobin(ids) {
	const list = [...ids];
	if (list.length % 2) list.push(null);
	const n = list.length;
	const pairs = [];
	for (let round = 0; round < n - 1; round++) {
		for (let i = 0; i < n / 2; i++) {
			const [a, b] = [list[i], list[n - 1 - i]];
			if (a !== null && b !== null) pairs.push(round % 2 ? [b, a] : [a, b]);
		}
		list.splice(1, 0, list.pop());
	}
	return pairs;
}

function matchWinner(s) {
	const n = s.settings.playTo;
	if (!n) return null;
	const i = s.fighters.findIndex(f => f.wins >= n);
	return i === -1 ? null : i;
}

/**
 * The Store wraps state with undo history and change notification. Every
 * mutation goes through `apply`, which snapshots first so it can be undone.
 */
class Store {
	constructor(state = initialState(), { now = () => Date.now() } = {}) {
		this.state = state;
		this.undoStack = [];
		this.now = now;
		this.listeners = new Set();
	}

	subscribe(fn) {
		this.listeners.add(fn);
		return () => this.listeners.delete(fn);
	}

	emit() {
		for (const fn of this.listeners) fn(this.state);
	}

	/** Replace state wholesale, e.g. from another window. Not undoable. */
	replace(state, undoStack = this.undoStack) {
		this.state = state;
		this.undoStack = undoStack;
		this.emit();
	}

	/**
	 * `clock: true` marks actions that change the clock on purpose, so undoing
	 * them puts the old time back. Undoing anything else leaves the clock alone.
	 */
	apply(mutate, { undoable = true, clock = false } = {}) {
		const before = structuredClone(this.state);
		const result = mutate(this.state);
		if (result === false) return false;
		if (undoable) {
			this.undoStack.push({ state: before, clock });
			if (this.undoStack.length > UNDO_LIMIT) this.undoStack.shift();
		}
		this.emit();
		return true;
	}

	canUndo() {
		return this.undoStack.length > 0;
	}

	undo() {
		const entry = this.undoStack.pop();
		if (!entry) return false;
		const prev = entry.state;
		// Undoing a hit restores scores and the log but doesn't rewind the
		// clock: if the timer is running it keeps running from where it is now.
		const t = timeLeft(this.state, this.now());
		const running = isRunning(this.state);
		const sameRound = prev.round === this.state.round && prev.suddenDeath === this.state.suddenDeath &&
			prev.rounds.length === this.state.rounds.length;
		if (!entry.clock && sameRound && t > 0) {
			prev.remaining = t;
			prev.startedAt = running ? this.now() : null;
		} else if (!entry.clock && sameRound && this.state.stoppedAtTarget !== null && prev.stoppedAtTarget === null) {
			// Taking back the winning point: back to the time it was scored at, paused.
			prev.remaining = this.state.stoppedAtTarget;
			prev.startedAt = null;
		}
		// Settings changes aren't undoable, so undo never rolls them back.
		prev.settings = this.state.settings;
		prev.pool = this.state.pool;
		this.state = prev;
		this.emit();
		return true;
	}

	// --- timer ---

	start() {
		return this.apply(s => {
			if (isRunning(s) || timeLeft(s) === 0 || isUntimed(s) || s.medical) return false;
			s.startedAt = this.now();
			// Fighting again means any fighter switch has been made.
			s.tagSwitch = null;
		}, { undoable: false });
	}

	pause() {
		return this.apply(s => {
			if (!isRunning(s)) return false;
			s.remaining = timeLeft(s, this.now());
			s.startedAt = null;
		}, { undoable: false });
	}

	/** The table saw an attempt to score, so sudden death goes on without the warning. */
	attempt() {
		return this.apply(s => {
			if (!s.suddenDeath || s.attemptMade) return false;
			s.attemptMade = true;
		}, { undoable: false });
	}

	/** Pauses the bout and starts the medical hold. */
	startMedical() {
		return this.apply(s => {
			if (s.medical) return false;
			if (isRunning(s)) s.remaining = timeLeft(s, this.now());
			s.startedAt = null;
			s.medical = { startedAt: this.now() };
		}, { undoable: false });
	}

	/** The fighter is ready (or out); the bout clock can start again. */
	endMedical() {
		return this.apply(s => {
			if (!s.medical) return false;
			s.medical = null;
		}, { undoable: false });
	}

	toggleClock() {
		return isRunning(this.state) ? this.pause() : this.start();
	}

	/** Called by the UI when the running clock reaches zero. */
	expire() {
		return this.apply(s => {
			if (!isRunning(s) || timeLeft(s, this.now()) > 0) return false;
			s.remaining = 0;
			s.startedAt = null;
			if (s.settings.finalExchange && s.settings.liveScore && !s.suddenDeath) {
				s.finalExchange = true;
				s.showWinner = false;
				this.#logEvent(s, 'final-exchange');
			} else {
				this.#logEvent(s, 'time-up');
			}
		}, { undoable: false });
	}

	/** True while a final exchange can't end without a point: the scores are one apart (Rules 5.13-2b). */
	pointRequired() {
		const [a, b] = this.state.fighters;
		return this.state.finalExchange && Math.abs(a.score - b.score) === 1;
	}

	/** The final exchange ends with no point ("No call", or no attempt to score). */
	noCall() {
		return this.apply(s => {
			if (!s.finalExchange) return false;
			this.#endFinalExchange(s);
			this.#logEvent(s, 'no-call');
		});
	}

	#endFinalExchange(s) {
		s.finalExchange = false;
		s.showWinner = true;
	}

	setTime(ms) {
		return this.apply(s => {
			s.remaining = Math.max(0, ms);
			if (isRunning(s)) s.startedAt = this.now();
		}, { clock: true });
	}

	endRoundNow() {
		return this.apply(s => {
			if (timeLeft(s, this.now()) === 0) return false;
			s.remaining = 0;
			s.startedAt = null;
			this.#logEvent(s, 'round-ended');
		}, { clock: true });
	}

	// --- scoring ---

	#logEvent(s, kind, extra = {}) {
		s.log.push({
			at: this.now(),
			round: s.round,
			suddenDeath: s.suddenDeath,
			clock: timeLeft(s, this.now()),
			kind,
			...extra,
			scores: s.fighters.map(f => f.score),
			simul: s.simul,
		});
	}

	#afterScoring(s) {
		if (s.suddenDeath && leader(s) !== null) {
			s.remaining = 0;
			s.startedAt = null;
		}
		const target = s.settings.pointsToWin;
		if (target && timeLeft(s, this.now()) > 0 && s.fighters.some(f => f.score >= target)) {
			s.stoppedAtTarget = timeLeft(s, this.now());
			this.#logEvent(s, 'target-reached', { side: s.fighters.findIndex(f => f.score >= target) });
			s.remaining = 0;
			s.startedAt = null;
		}
		if (timeLeft(s, this.now()) === 0 && !s.finalExchange) s.showWinner = true;
		// Corners switch once per round at half the target. Tag Team has its own switches.
		const half = Math.ceil(target / 2);
		if (target && !s.sidesCalled && !s.suddenDeath && !isTagTeam(s) && s.remaining > 0 &&
			s.fighters.some(f => f.score >= half && f.score < target)) {
			s.sidesCalled = true;
			s.sidesDue = true;
			this.#logEvent(s, 'switch-sides');
		}
		if (s.settings.pauseAfterScoring && isRunning(s)) {
			s.remaining = timeLeft(s, this.now());
			s.startedAt = null;
		}
	}

	addPoint(side, delta = 1) {
		return this.apply(s => {
			if (!s.settings.liveScore) return false;
			// Scores never go below zero.
			if (s.fighters[side].score + delta < 0) return false;
			s.fighters[side].score += delta;
			s.tagSwitch = null;
			// An awarded point always resolves the final exchange; taking one back doesn't.
			if (s.finalExchange && delta > 0) this.#endFinalExchange(s);
			this.#logEvent(s, 'point', { side, delta });
			this.#afterScoring(s);
		});
	}

	addSimul(delta = 1) {
		return this.apply(s => {
			if (!s.settings.liveScore) return false;
			if (delta < 0 && s.simul === 0) return false;
			const cutoff = s.settings.simulCutoff;
			let taken;
			if (delta > 0) {
				// A simul ends the final exchange, unless the scores are one
				// apart: then only a point can (Rules 5.13-2b).
				if (s.finalExchange && !this.pointRequired()) this.#endFinalExchange(s);
				// The penalty applies from the cutoff-th simul on (1-based), and
				// only while both fighters have a point to lose. If either is at
				// zero, nobody loses one. Tag Team switches fighters instead.
				const tag = isTagTeam(s);
				const penalized = !tag && cutoff && s.simul + 1 >= cutoff && s.fighters.every(f => f.score > 0);
				taken = s.fighters.map(() => (penalized ? 1 : 0));
				s.simulPenalties.push(taken);
				s.fighters.forEach((f, i) => { f.score -= taken[i]; });
				s.tagSwitch = tag ? { stayed: [false, false] } : null;
			} else {
				taken = s.simulPenalties.pop() ?? [0, 0];
				s.fighters.forEach((f, i) => { f.score += taken[i]; });
			}
			s.simul += delta;
			this.#logEvent(s, 'simul', { delta, taken, ...(delta > 0 && isTagTeam(s) ? { tag: true } : {}) });
			this.#afterScoring(s);
		});
	}

	/** Can this team pay a point to keep its fighter in? Not with no points, and never in sudden death (Rules 8.04, 8.05). */
	canStay(side) {
		const s = this.state;
		return !!s.tagSwitch && !s.tagSwitch.stayed[side] && !s.suddenDeath && s.fighters[side].score > 0;
	}

	/** Tag Team: this team takes −1 to skip the switch the simul called for. */
	stay(side) {
		if (!this.canStay(side)) return false;
		return this.apply(s => {
			s.fighters[side].score -= 1;
			s.tagSwitch.stayed[side] = true;
			this.#logEvent(s, 'stay', { side });
		});
	}

	/** The fighters have switched; clear the call from the screens. */
	/** The corners switch was handled (or skipped); clear the call from the screens. */
	sidesDone() {
		return this.apply(s => {
			if (!s.sidesDue) return false;
			s.sidesDue = false;
		}, { undoable: false });
	}

	switchDone() {
		return this.apply(s => {
			if (!s.tagSwitch) return false;
			s.tagSwitch = null;
		}, { undoable: false });
	}

	// --- judges' tally (no live score) ---

	setTally(judge, side, value) {
		return this.apply(s => {
			if (s.tally.published) return false;
			const n = Math.floor(value);
			s.tally.judges[judge][side] = value === null || Number.isNaN(n) ? null : Math.max(0, n);
		}, { undoable: false });
	}

	/** Enough judges have reported both scores to publish. */
	tallyComplete() {
		return tallyResult(this.state).reported >= MIN_JUDGES;
	}

	/** Reveals the averages and the winner on every screen. */
	publishTally() {
		if (!this.tallyComplete() || this.state.tally.published) return false;
		return this.apply(s => {
			const { averages, votes, scores } = tallyResult(s);
			s.fighters.forEach((f, i) => { f.score = scores[i]; });
			s.tally.votes = votes;
			s.tally.averages = averages;
			s.tally.published = true;
			s.showWinner = true;
			// Judges report once the round is over, so publishing closes the clock.
			s.remaining = 0;
			s.startedAt = null;
			this.#logEvent(s, 'tally-published', { votes });
		}, { clock: true });
	}

	/** Takes a published result back so the tallies can be corrected. */
	unpublishTally() {
		return this.apply(s => {
			if (!s.tally.published) return false;
			s.fighters.forEach(f => { f.score = 0; });
			s.tally.published = false;
			if (s.suddenDeath) {
				// Taking the result back also calls off its sudden death.
				s.suddenDeath = false;
				s.remaining = 0;
				s.startedAt = null;
			}
			s.tally.votes = [0, 0];
			s.tally.averages = [0, 0];
			s.tally.tieWinner = null;
			this.#logEvent(s, 'tally-unpublished');
		}, { clock: true });
	}

	/** After a tied tally, the Marshal's sudden death names the winner (Rules 9.12a-2). */
	setTieWinner(side) {
		return this.apply(s => {
			if (!s.tally.published || s.tally.votes[0] !== s.tally.votes[1]) return false;
			s.tally.tieWinner = side;
			// The sudden-death winner gets the higher recorded score.
			recordScores(s.tally.averages, side).forEach((v, i) => { s.fighters[i].score = v; });
			// The Marshal's call ends sudden death.
			s.remaining = 0;
			s.startedAt = null;
			this.#logEvent(s, 'tie-broken', { side });
		}, { clock: true });
	}

	// --- cards (Rules 3.04) ---

	/**
	 * Gives a card. Yellow is a warning, and a second yellow counts as a red.
	 * Red takes a point, and may take the score below zero. Black forfeits the bout.
	 */
	giveCard(side, card, reason = null) {
		if (!(card in CARD_NAMES)) return false;
		return this.apply(s => {
			const f = s.fighters[side];
			let effective = card;
			let converted = false;
			if (card === 'yellow') {
				if (f.cards.yellow >= 1) {
					f.cards.yellow = 0;
					effective = 'red';
					converted = true;
				} else {
					f.cards.yellow = 1;
				}
			}
			let delta = 0;
			const before = timeLeft(s, this.now());
			if (effective === 'red') {
				f.cards.red++;
				// Unity keeps no live score here; the card is just recorded.
				if (s.settings.liveScore) {
					f.score -= 1;
					delta = -1;
				}
			} else if (effective === 'black') {
				f.cards.black++;
				s.forfeit = side;
				s.remaining = 0;
				s.startedAt = null;
				s.finalExchange = false;
				s.showWinner = true;
			}
			s.tagSwitch = null;
			this.#logEvent(s, 'card', { side, card, effective, converted, reason, delta, left: before });
			if (effective === 'red') this.#afterScoring(s);
		}, { clock: card === 'black' });
	}

	/** The fighter didn't show: a 0–10 loss and the bout is over (Rule 5.06). */
	noShow(side) {
		return this.apply(s => {
			if (s.forfeit !== null) return false;
			s.forfeit = side;
			s.noShow = true;
			if (s.settings.liveScore) {
				s.fighters[side].score = 0;
				s.fighters[1 - side].score = s.settings.pointsToWin || NO_SHOW_SCORE;
			}
			s.remaining = 0;
			s.startedAt = null;
			s.finalExchange = false;
			s.sidesDue = false;
			s.tagSwitch = null;
			s.showWinner = true;
			this.#logEvent(s, 'no-show', { side });
		}, { clock: true });
	}

	/**
	 * Takes back one card given by mistake, even after more scoring. A card given in this
	 * bout also gives back the point it took; a card carried in from an earlier bout only
	 * comes off the record. Undoing a black card gives the clock back too.
	 */
	removeCard(side, card) {
		if (!(card in CARD_NAMES)) return false;
		return this.apply(s => {
			const f = s.fighters[side];
			if (!f.cards[card]) return false;
			const entry = [...s.log].reverse().find(e => e.kind === 'card' && e.side === side && !e.voided && e.effective === card);
			f.cards[card]--;
			if (entry) {
				entry.voided = true;
				if (entry.converted) f.cards.yellow = 1;
				if (entry.delta) f.score -= entry.delta;
				if (card === 'black') {
					s.forfeit = null;
					s.remaining = entry.left ?? s.settings.duration;
					s.startedAt = null;
					s.showWinner = true;
				}
			}
			this.#logEvent(s, 'card-removed', { side, card });
			if (card === 'red') this.#afterScoring(s);
		}, { clock: card === 'black' });
	}

	/** Clears a fighter's cards, e.g. for a new event or a different fighter. */
	clearCards(side) {
		return this.apply(s => {
			s.fighters[side].cards = noCards();
		}, { undoable: false });
	}

	toggleShowWinner() {
		return this.apply(s => {
			if (s.finalExchange) return false;
			s.showWinner = !s.showWinner;
		}, { undoable: false });
	}

	// --- rounds ---

	/** What the next-round button would do right now: 'next', 'tiebreaker', or null. */
	nextRoundAction() {
		const s = this.state;
		if (timeLeft(s, this.now()) > 0) return null;
		if (s.finalExchange) return null;
		if (matchWinner(s) !== null) return null;
		if (!s.settings.liveScore) {
			// Unity: tied or split judge votes go to sudden death, once.
			const tied = s.tally.published && s.tally.votes[0] === s.tally.votes[1] && s.tally.tieWinner === null;
			return tied && !s.suddenDeath ? 'tiebreaker' : 'next';
		}
		return leader(s) !== null || s.suddenDeath ? 'next' : 'tiebreaker';
	}

	nextRound() {
		const action = this.nextRoundAction();
		if (!action) return false;
		return this.apply(s => {
			if (action === 'tiebreaker') {
				s.suddenDeath = true;
				s.attemptMade = false;
				// An untimed sudden death keeps a token sliver on the clock so the round isn't "over" until a winner is named.
				s.remaining = s.settings.tiebreakerDuration || UNTIMED_REMAINING;
				s.startedAt = null;
				this.#logEvent(s, 'tiebreaker');
				return;
			}
			const w = leader(s);
			if (w !== null) s.fighters[w].wins++;
			s.rounds.push({
				round: s.round,
				scores: s.fighters.map(f => f.score),
				simul: s.simul,
				winner: w,
				suddenDeath: s.suddenDeath,
			});
			this.#logEvent(s, 'round-won', { side: w });
			if (matchWinner(s) !== null) return;
			s.round++;
			this.#resetRound(s);
		});
	}

	#resetRound(s) {
		for (const f of s.fighters) f.score = 0;
		s.simul = 0;
		s.simulPenalties = [];
		s.suddenDeath = false;
		s.forfeit = null;
		s.noShow = false;
		s.finalExchange = false;
		s.tagSwitch = null;
		s.sidesCalled = false;
		s.sidesDue = false;
		s.medical = null;
		s.attemptMade = false;
		s.tally = emptyTally();
		s.stoppedAtTarget = null;
		s.remaining = s.settings.duration;
		s.startedAt = null;
		s.showWinner = true;
	}

	resetRound() {
		return this.apply(s => {
			this.#resetRound(s);
			this.#logEvent(s, 'round-reset');
		});
	}

	/** Start a new match. Keeps fighter names/colors and settings unless `full`. */
	newMatch({ full = false } = {}) {
		return this.apply(s => {
			const fresh = initialState(s.settings);
			if (!full) {
				fresh.fighters = s.fighters.map(f => ({ ...f, score: 0, wins: 0 }));
			}
			Object.assign(s, fresh);
		});
	}

	swapSides() {
		return this.apply(s => {
			s.sidesDue = false;
			s.fighters.reverse();
			s.simulPenalties = s.simulPenalties.map(p => [...p].reverse());
			s.tally.judges = s.tally.judges.map(j => [...j].reverse());
			s.tally.votes = [...s.tally.votes].reverse();
			s.tally.averages = [...s.tally.averages].reverse();
			if (s.tally.tieWinner !== null) s.tally.tieWinner = 1 - s.tally.tieWinner;
			for (const e of s.log) {
				e.scores = [...e.scores].reverse();
				if (typeof e.side === 'number') e.side = 1 - e.side;
			}
			for (const r of s.rounds) {
				r.scores = [...r.scores].reverse();
				if (r.winner !== null) r.winner = 1 - r.winner;
			}
		});
	}

	// --- pool ---

	/** The pool's setup is locked once a result is recorded. */
	#poolLocked() {
		return this.state.pool.bouts.some(b => b.result);
	}

	addPoolFighter(name) {
		const clean = String(name).trim().slice(0, 40);
		return this.apply(s => {
			if (!clean || this.#poolLocked() || s.pool.fighters.some(f => f.name.toLowerCase() === clean.toLowerCase())) return false;
			s.pool.fighters.push({ id: s.pool.nextId++, name: clean, cards: noCards() });
			s.pool.bouts = [];
			s.pool.active = null;
		}, { undoable: false });
	}

	removePoolFighter(id) {
		return this.apply(s => {
			if (this.#poolLocked() || !s.pool.fighters.some(f => f.id === id)) return false;
			s.pool.fighters = s.pool.fighters.filter(f => f.id !== id);
			s.pool.bouts = [];
			s.pool.active = null;
		}, { undoable: false });
	}

	/** Lays out every pairing once. */
	buildPoolBouts() {
		return this.apply(s => {
			if (this.#poolLocked() || s.pool.fighters.length < 2) return false;
			s.pool.bouts = roundRobin(s.pool.fighters.map(f => f.id)).map(([a, b], i) => ({ id: i + 1, a, b, result: null }));
			s.pool.active = null;
		}, { undoable: false });
	}

	/** Empties the pool: fighters, bouts and results. */
	clearPool() {
		return this.apply(s => {
			s.pool = emptyPool();
		}, { undoable: false });
	}

	/** Puts a bout's two fighters on the scoreboard, with a fresh round and the cards they already carry. */
	loadPoolBout(boutId) {
		return this.apply(s => {
			const bout = s.pool.bouts.find(b => b.id === boutId);
			if (!bout || bout.result) return false;
			// Cards given in a bout that is being left unrecorded still count.
			if (s.pool.active !== null) {
				for (const f of s.fighters) {
					const pf = s.pool.fighters.find(x => x.id === f.poolId);
					if (pf) pf.cards = structuredClone(f.cards);
				}
			}
			const fresh = initialState(s.settings);
			Object.assign(s, { ...fresh, pool: s.pool });
			[bout.a, bout.b].forEach((id, i) => {
				const pf = s.pool.fighters.find(f => f.id === id);
				Object.assign(s.fighters[i], { name: pf.name, subtitle: '', poolId: id, cards: structuredClone(pf.cards) });
			});
			s.pool.active = boutId;
		}, { undoable: false });
	}

	/** Records the loaded bout's result once it is decided, and carries the cards back to the pool. */
	recordPoolBout() {
		return this.apply(s => {
			const bout = s.pool.bouts.find(b => b.id === s.pool.active);
			if (!bout || !boutDecided(s, this.now())) return false;
			const ids = s.fighters.map(f => f.poolId);
			if (!ids.includes(bout.a) || !ids.includes(bout.b)) return false;
			const scores = boutScores(s);
			const w = leader(s);
			bout.result = {
				scores: [scores[ids.indexOf(bout.a)], scores[ids.indexOf(bout.b)]],
				winner: w === null ? null : ids[w],
			};
			s.fighters.forEach(f => {
				const pf = s.pool.fighters.find(x => x.id === f.poolId);
				if (pf) pf.cards = structuredClone(f.cards);
			});
			s.pool.lastFinish = { at: this.now(), ids: [bout.a, bout.b] };
			s.pool.active = null;
		}, { undoable: false });
	}

	/** Takes a recorded result back, e.g. when it was entered for the wrong bout. */
	clearPoolResult(boutId) {
		return this.apply(s => {
			const bout = s.pool.bouts.find(b => b.id === boutId);
			if (!bout?.result) return false;
			bout.result = null;
		}, { undoable: false });
	}

	// --- setup ---

	updateFighter(side, changes) {
		return this.apply(s => {
			const f = s.fighters[side];
			// Keep the default name in step with the color, like the original app.
			if (changes.color && !('name' in changes) && f.name === COLORS[f.color]?.label) {
				f.name = COLORS[changes.color].label;
			}
			Object.assign(f, changes);
		}, { undoable: false });
	}

	updateSettings(changes) {
		return this.apply(s => {
			const durationChanged = 'duration' in changes && changes.duration !== s.settings.duration;
			Object.assign(s.settings, changes);
			// If the round hasn't started, the new duration applies right away.
			if (durationChanged && !s.suddenDeath && !isRunning(s) && s.remaining !== 0 &&
				!s.fighters.some(f => f.score) && s.simul === 0) {
				s.remaining = s.settings.duration;
			}
			// Turning Final Exchange off mid-exchange decides the bout now.
			if (changes.finalExchange === false && s.finalExchange) {
				s.finalExchange = false;
				s.showWinner = true;
			}
		}, { undoable: false });
	}

	applyPreset(id) {
		const preset = MATCH_PRESETS.find(p => p.id === id);
		if (!preset) return false;
		return this.updateSettings(preset.settings);
	}

	/**
	 * Picks the division. Championship Series is best of 3, so entering it
	 * sets that up; leaving it clears it, unless it was changed by hand.
	 */
	#selectDivision(st, division) {
		const was = st.division;
		if (division === ROUNDS_DIVISION && was !== ROUNDS_DIVISION && !st.playTo) {
			st.playTo = CS_ROUNDS_TO_WIN;
		} else if (was === ROUNDS_DIVISION && division !== ROUNDS_DIVISION && st.playTo === CS_ROUNDS_TO_WIN) {
			st.playTo = 0;
		}
		st.division = division;
	}

	setDivision(name) {
		return this.apply(s => {
			this.#selectDivision(s.settings, String(name ?? '').trim());
		}, { undoable: false });
	}

	/** Adds a typed-in division to the saved list (once) and selects it. */
	addCustomDivision(name) {
		const clean = String(name ?? '').trim().replace(/\s+/g, ' ').slice(0, 40);
		if (!clean) return false;
		return this.apply(s => {
			const st = s.settings;
			const same = d => d.toLowerCase() === clean.toLowerCase();
			const existing = DIVISIONS.find(same) ?? st.customDivisions.find(same);
			if (!existing) st.customDivisions = [...st.customDivisions, clean];
			this.#selectDivision(st, existing ?? clean);
		}, { undoable: false });
	}

	removeCustomDivision(name) {
		return this.apply(s => {
			const st = s.settings;
			if (!st.customDivisions.includes(name)) return false;
			st.customDivisions = st.customDivisions.filter(d => d !== name);
			if (st.division === name) this.#selectDivision(st, '');
		}, { undoable: false });
	}

	setRound(n) {
		return this.apply(s => {
			s.round = Math.max(1, Math.floor(n) || 1);
		});
	}

	setWins(side, n) {
		return this.apply(s => {
			s.fighters[side].wins = Math.max(0, Math.floor(n) || 0);
		});
	}
}

// --- formatting ---

function formatClock(ms, { hundredths = true } = {}) {
	const m = Math.floor(ms / 60000);
	const sec = Math.floor(ms / 1000) % 60;
	const base = `${m}:${String(sec).padStart(2, '0')}`;
	if (!hundredths) return base;
	return `${base}.${String(Math.floor(ms / 10) % 100).padStart(2, '0')}`;
}

/** Parses "m:ss", "ss", or "m:ss.ms". Returns ms, or null if invalid. */
function parseClock(str) {
	const m = /^(?:(\d+):)?(\d+)(?:\.(\d+))?$/.exec(String(str).trim());
	if (!m) return null;
	const [, min, sec, frac] = m;
	const ms = parseInt((frac || '0').slice(0, 3).padEnd(3, '0'), 10);
	return (parseInt(min || '0', 10) * 60 + parseInt(sec, 10)) * 1000 + ms;
}

function fighterLabel(s, side) {
	return s.fighters[side].name || (side === 0 ? 'Left' : 'Right');
}

function describeEvent(s, e) {
	const who = i => (typeof i === 'number' ? fighterLabel(s, i) : '');
	switch (e.kind) {
	case 'point': return `${e.delta > 0 ? '+1' : '−1'} ${who(e.side)}`;
	case 'simul': {
		if (e.delta < 0) return 'Simul removed';
		if (e.tag) return 'Simul (switch fighters)';
		const taken = e.taken ?? (e.penalty ? [1, 1] : [0, 0]);
		if (taken[0] && taken[1]) return 'Simul (−1 both)';
		if (taken[0] || taken[1]) return `Simul (−1 ${who(taken[0] ? 0 : 1)})`;
		return 'Simul';
	}
	case 'card': {
		const why = e.reason ? ` · ${e.reason}` : '';
		if (e.voided) return `${who(e.side)} ${e.card} card${why} (taken back)`;
		if (e.converted) return `${who(e.side)} second yellow, red card${e.delta ? ' −1' : ''}${why}`;
		const base = `${who(e.side)} ${e.card} card`;
		if (e.card === 'black') return `${base}, forfeit${why}`;
		return `${base}${e.delta ? ' −1' : ''}${why}`;
	}
	case 'card-removed': return `${who(e.side)} ${e.card} card taken back`;
	case 'time-up': return 'Time up';
	case 'tally-published': return `Judges' tally published: ${e.votes[0]}–${e.votes[1]} votes, score ${e.scores[0]}–${e.scores[1]}`;
	case 'tally-unpublished': return 'Tally taken back';
	case 'tie-broken': return `Tie decided in sudden death: ${who(e.side)}`;
	case 'no-show': return `${who(e.side)} did not show, ${e.scores[1 - e.side]}–${e.scores[e.side]} forfeit`;
	case 'switch-sides': return 'Switch sides';
	case 'final-exchange': return 'Final exchange';
	case 'no-call': return 'No call, bout over';
	case 'stay': return `${who(e.side)} took −1 to stay in`;
	case 'target-reached': return `${who(e.side)} reached ${e.scores[e.side]}`;
	case 'round-ended': return 'Round ended early';
	case 'tiebreaker': return 'Tiebreaker (sudden death)';
	case 'round-won': return e.side === null ? 'Round over, no winner' : `Round won by ${who(e.side)}`;
	case 'round-reset': return 'Round reset';
	default: return e.kind;
	}
}

function logToCSV(s) {
	const esc = v => `"${String(v).replace(/"/g, '""')}"`;
	const rows = [['time', 'round', 'clock', 'event', s.fighters[0].name, s.fighters[1].name, 'simuls']];
	for (const e of s.log) {
		rows.push([
			new Date(e.at).toISOString(),
			e.round + (e.suddenDeath ? ' (SD)' : ''),
			formatClock(e.clock),
			describeEvent(s, e),
			e.scores[0],
			e.scores[1],
			e.simul,
		]);
	}
	return rows.map(r => r.map(esc).join(',')).join('\n');
}


const STORAGE_KEY = 'tsl_scoreboard';
// A display opened in its own window (?view=display) only shows the score.
// A display switched on in this window (F) still takes keyboard input and
// runs the clock, since no other window is controlling it.
const displayWindow = new URLSearchParams(location.search).get('view') === 'display';
let view = displayWindow ? 'display' : 'control';
document.body.dataset.view = view;

// --- persistence and sync between windows on this device ---

function load() {
	try {
		const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
		return { state: normalize(saved?.state), undo: Array.isArray(saved?.undo) ? saved.undo : [] };
	} catch {
		return { state: normalize(null), undo: [] };
	}
}

const loaded = load();
const store = new Store(loaded.state);
store.undoStack = loaded.undo;
let lastSaved = '';

store.subscribe(() => {
	const json = JSON.stringify({ state: store.state, undo: store.undoStack });
	if (json === lastSaved) return;
	lastSaved = json;
	try {
		localStorage.setItem(STORAGE_KEY, json);
	} catch {
		// Storage full or blocked: keep running from memory.
	}
});

window.addEventListener('storage', e => {
	if (e.key !== STORAGE_KEY || !e.newValue || e.newValue === lastSaved) return;
	lastSaved = e.newValue;
	const next = load();
	store.replace(next.state, next.undo);
});

// --- helpers ---

const $ = sel => document.querySelector(sel);
const esc = v => String(v).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const hex = color => COLORS[color]?.hex ?? '#555';

function dots(s, side) {
	const f = s.fighters[side];
	const total = Math.max(s.settings.playTo, f.wins);
	if (!total) return '';
	let out = '';
	for (let i = 0; i < total; i++) out += `<span class="dot${i < f.wins ? ' on' : ''}"></span>`;
	return `<div class="dots" aria-label="${f.wins} round wins">${out}</div>`;
}

function subtitle(f) {
	if (!f.subtitle) return '';
	return `<div class="subtitle">${f.subtitle.split('\n').map(esc).join('<br>')}</div>`;
}

// The open penalty sheet's choices, or null while it is closed.
let penalty = null;

/** Small card marks next to a fighter's name: Y, R2, B. */
function cardChips(f) {
	const c = f.cards;
	const chip = (kind, n) => (n ? `<span class="card-chip ${kind}" title="${CARD_NAMES[kind]} card">${n > 1 ? n : ''}</span>` : '');
	return hasCards(f) ? `<span class="card-chips">${chip('yellow', c.yellow)}${chip('red', c.red)}${chip('black', c.black)}</span>` : '';
}

function cardPanel(s) {
	if (!penalty) return '';
	const { side, card, reason } = penalty;
	const pick = (key, value, label, extra = '', style = '') =>
		`<button type="button" class="pill${String(penalty[key]) === value ? ' on' : ''}" data-action="penalty-pick" data-key="${key}" data-value="${esc(value)}" aria-pressed="${String(penalty[key]) === value}" ${style}>${label}${extra}</button>`;
	const fighters = [0, 1].map(i => pick('side', String(i), esc(fighterLabel(s, i)), '', `style="--c:${hex(s.fighters[i].color)}"`));
	const cards = [...['yellow', 'red', 'black'].map(c => pick('card', c, CARD_NAMES[c])), pick('card', 'no-show', 'No-show')];
	const reasons = card === 'no-show' ? [] : CARD_REASONS.map(r => pick('reason', r, esc(r)));
	// Cards already given, each with a way to take it back.
	const given = [0, 1].flatMap(i => ['yellow', 'red', 'black'].flatMap(c =>
		Array.from({ length: s.fighters[i].cards[c] }, (_, n) => {
			const log = s.log.filter(e => e.kind === 'card' && e.side === i && !e.voided && e.effective === c);
			const why = log[log.length - 1 - (s.fighters[i].cards[c] - 1 - n)]?.reason;
			return `<button type="button" class="pill taken" style="--c:${hex(s.fighters[i].color)}" data-action="card-remove" data-side="${i}" data-card="${c}" aria-label="Take back ${CARD_NAMES[c]} card for ${esc(fighterLabel(s, i))}">${esc(fighterLabel(s, i))} · ${CARD_NAMES[c]}${why ? ` · ${esc(why)}` : ''} ✕</button>`;
		})));
	return `<section class="penalty-sheet">
		<h3>Penalty</h3>
		${given.length ? `<div class="pills">${given.join('')}</div>` : ''}
		<div class="pills">${fighters.join('')}</div>
		<div class="pills">${cards.join('')}</div>
		${reasons.length ? `<div class="pills">${reasons.join('')}</div>` : ''}
		<div class="row"><button class="btn" data-action="penalty-close">Cancel</button><button class="btn primary" data-action="penalty-give" ${side !== null && card ? '' : 'disabled'}>${card === 'no-show' ? 'Record no-show' : card ? `Give ${card} card` : 'Give card'}</button></div>
	</section>`;
}

const DECISION_LABELS = { unanimous: 'Unanimous decision', split: 'Split decision', draw: 'Draw' };

/** The big line under the clock: winner, tie, time up, sudden death, paused. */
function statusLine(s) {
	const mw = matchWinner(s);
	if (mw !== null) {
		return `<span class="status win" style="--c:${hex(s.fighters[mw].color)}">Match won by <strong>${esc(fighterLabel(s, mw))}</strong></span>`;
	}
	if (s.finalExchange) return '<span class="status alert">Final exchange</span>';
	if (timeLeft(s) === 0) {
		if (!s.settings.liveScore && !s.tally.published) return '<span class="status alert">Time up</span>';
		if (!s.showWinner && !s.suddenDeath) return '<span class="status alert">Time up</span>';
		const w = leader(s);
		if (!s.settings.liveScore && w === null) return `<span class="status alert">${DECISION_LABELS.draw}</span>`;
		if (w === null) return '<span class="status alert">Tie</span>';
		// A decision by the judges names its kind; a sudden-death winner is just listed.
		const kind = !s.settings.liveScore && s.tally.tieWinner === null
			? `<div class="status-sub">${DECISION_LABELS[decisionOf(s.tally.votes)]}</div>` : '';
		const forfeit = s.forfeit !== null ? `<div class="status-sub">${s.noShow ? 'No-show' : 'Forfeit'}</div>` : '';
		return `<span class="status win" style="--c:${hex(s.fighters[w].color)}">Winner: <strong>${esc(fighterLabel(s, w))}</strong></span>${forfeit || kind}`;
	}
	if (isUntimed(s)) return '<span class="status muted">&nbsp;</span>';
	if (s.suddenDeath) return '<span class="status alert">Sudden death</span>';
	if (!isRunning(s) && hasStarted(s)) return '<span class="status muted">Paused</span>';
	return '<span class="status muted">&nbsp;</span>';
}

/** One line for the rules in play, e.g. "Standard · 2:30, first to 10". */
function rulesLine(s) {
	const st = s.settings;
	const p = activePreset(st);
	if (p) return `${p.label} · ${presetNote(p, st)}`;
	const parts = [formatClock(st.duration, { hundredths: false })];
	if (st.liveScore && st.pointsToWin) parts.push(`first to ${st.pointsToWin}`);
	return `Custom · ${parts.join(', ')}`;
}

/** The division banner shown above the clock, if one is picked. */
function divisionHTML(s, cls) {
	return s.settings.division ? `<div class="${cls}">${esc(s.settings.division)}</div>` : '';
}

/** What moving on is called: rounds only exist in Championship Series. */
const nextLabel = s => (usesRounds(s) ? 'Next round' : 'Next match');

/** The clock reading, or a label while sudden death is untimed. */
const clockText = s => (isUntimed(s) ? 'Sudden death' : formatClock(timeLeft(s)));

/** The display font's digits differ in width, so each gets a fixed-width cell to keep the clock still. */
function clockHTML(text) {
	return [...text].map(c => (/\d/.test(c) ? `<span class="dg">${c}</span>` : c)).join('');
}

// --- control view ---

function primaryButton(s) {
	if (timeLeft(s) === 0 && !s.settings.liveScore) {
		const sd = store.nextRoundAction() === 'tiebreaker';
		return `<button class="btn primary" data-action="next">${sd ? `Sudden death${s.settings.tiebreakerDuration ? ` · ${formatClock(s.settings.tiebreakerDuration, { hundredths: false })}` : ''}` : nextLabel(s)}</button>`;
	}
	if (s.finalExchange) return '<button class="btn primary" data-action="no-call">No call · end bout</button>';
	if (timeLeft(s) === 0) {
		return `<button class="btn primary" data-action="winner">${s.showWinner ? 'Hide winner' : 'Show winner'}</button>`;
	}
	if (isRunning(s)) return '<button class="btn primary pause" data-action="clock">Pause</button>';
	// Untimed sudden death has no clock to run: the Marshal's call is entered in the tally.
	if (isUntimed(s)) return '';
	// A fresh sudden death starts rather than resumes.
	const freshSuddenDeath = s.suddenDeath && s.remaining === s.settings.tiebreakerDuration;
	return `<button class="btn primary go" data-action="clock" ${s.medical ? 'disabled' : ''}>${hasStarted(s) && !freshSuddenDeath ? 'Resume' : 'Start'}</button>`;
}

/** During the final exchange, the one thing the table can't guess: a one-point gap needs a point. */
function finalExchangeNote() {
	return store.pointRequired() ? '<p class="fe-note"><strong>Point required</strong></p>' : '';
}

/** Tag Team, after a simul: who switches and who paid to stay in. */
function switchText(s) {
	const stayed = s.tagSwitch.stayed;
	if (!stayed[0] && !stayed[1]) return 'Switch fighters';
	return [0, 1].map(i => `${esc(fighterLabel(s, i))} ${stayed[i] ? 'stays (−1)' : 'switches'}`).join(' · ');
}

const medicalText = s => formatClock(medicalLeft(s), { hundredths: false });

function attemptPanel(s) {
	const left = attemptLeft(s);
	if (left === null) return '';
	return `<div class="switch-call attempt${left === 0 ? ' late' : ''}">
		<div class="switch-title">${left === 0 ? 'No attempt yet' : 'Attempt to score'} <span data-attempt>${formatClock(left, { hundredths: false })}</span></div>
		<div class="row"><button class="btn" data-action="attempt">Attempt made</button></div>
	</div>`;
}

const restText = r => formatClock(r.left, { hundredths: false });
const restNames = (s, r) => r.ids.map(id => esc(s.pool.fighters.find(f => f.id === id)?.name ?? '')).join(' and ');

function restPanel(s) {
	const r = restLeft(s);
	if (!r) return '';
	return `<div class="switch-call rest"><div class="switch-title">${restNames(s, r)} rest <span data-rest>${restText(r)}</span></div></div>`;
}

function medicalPanel(s) {
	if (!s.medical) return '';
	return `<div class="switch-call medical">
		<div class="switch-title">Medical hold <span data-medical>${medicalText(s)}</span></div>
		<div class="row"><button class="btn" data-action="medical-end">End hold</button></div>
	</div>`;
}

function switchPanel(s) {
	if (s.sidesDue) {
		return `<div class="switch-call">
		<div class="switch-title">Switch sides</div>
		<div class="row"><button class="btn" data-action="swap">Swap on screen</button><button class="btn" data-action="sides-done">Done</button></div>
	</div>`;
	}
	if (!s.tagSwitch) return '';
	const stayButton = i => (s.tagSwitch.stayed[i]
		? `<span class="stayed" style="--c:${hex(s.fighters[i].color)}">${esc(fighterLabel(s, i))} stays</span>`
		: `<button class="btn" style="--c:${hex(s.fighters[i].color)}" data-action="stay" data-side="${i}" ${store.canStay(i) ? '' : 'disabled'}>${esc(fighterLabel(s, i))}: −1 to stay</button>`);
	return `<div class="switch-call">
		<div class="switch-title">${switchText(s)}</div>
		<div class="row tag">${stayButton(0)}<button class="btn" data-action="switch-done">Switched</button>${stayButton(1)}</div>
	</div>`;
}

/** Unity: line judges report their silent tallies here; nothing shows on the display until it's published. */
function tallyPanel(s) {
	if (s.settings.liveScore) return '';
	const { reported, votes, scores } = tallyResult(s);
	const locked = s.tally.published;
	// Once published, the recorded scores are the fighters' own (a sudden-death winner can change them).
	const shown = locked ? s.fighters.map(f => f.score) : scores;
	const head = [0, 1].map(i => `<span class="tally-name" style="--c:${hex(s.fighters[i].color)}">${esc(fighterLabel(s, i))}</span>`).join('');
	const rows = s.tally.judges.map((judge, j) => `<div class="tally-row"><span>Judge ${j + 1}${j >= MIN_JUDGES ? ' <small>(optional)</small>' : ''}</span>${[0, 1].map(i => {
		const v = judge[i];
		return `<input type="number" min="0" inputmode="numeric" data-tally="${j}-${i}" value="${v ?? ''}" ${locked ? 'disabled' : ''} aria-label="Judge ${j + 1}, ${esc(fighterLabel(s, i))}" />`;
	}).join('')}</div>`).join('');
	let foot;
	if (!locked) {
		foot = `<button class="btn primary" data-action="publish" ${store.tallyComplete() ? '' : 'disabled'}>Publish winner</button>`;
	} else if (leader(s) === null) {
		foot = `${s.suddenDeath ? `<div class="row">${[0, 1].map(i => `<button class="btn" style="--c:${hex(s.fighters[i].color)}" data-action="tie-winner" data-side="${i}">${esc(fighterLabel(s, i))} won</button>`).join('')}</div>` : ''}
			<button class="btn" data-action="unpublish">Take back and edit</button>`;
	} else {
		foot = '<button class="btn" data-action="unpublish">Take back and edit</button>';
	}
	return `<section class="tally">
		<h3>Judges' tally</h3>
		<div class="tally-row tally-head"><span></span>${head}</div>
		${rows}
		<div class="tally-row tally-total"><span>Score</span><strong data-tally-total="0">${reported ? shown[0] : '–'}</strong><strong data-tally-total="1">${reported ? shown[1] : '–'}</strong></div>
		<p class="fe-note" data-tally-votes>${reported ? `${DECISION_LABELS[decisionOf(votes)]} (${votes[0]}–${votes[1]})` : ''}</p>
		${foot}
	</section>`;
}

function fighterPanel(s, side) {
	const f = s.fighters[side];
	if (!s.settings.liveScore) {
		return `<div class="fighter" style="--c:${hex(f.color)}">
			<div class="score-btn no-score">
				<span class="name">${esc(fighterLabel(s, side))}${cardChips(f)}</span>
				${subtitle(f)}
			</div>
			${dots(s, side)}
		</div>`;
	}
	const key = side === 0 ? ['Q', 'A'] : ['E', 'D'];
	return `<div class="fighter" style="--c:${hex(f.color)}">
		<button class="score-btn" data-action="point" data-side="${side}" aria-label="Add a point for ${esc(fighterLabel(s, side))}">
			<span class="name">${esc(fighterLabel(s, side))}${cardChips(f)}</span>
			${subtitle(f)}
			<span class="score">${f.score}</span>
			<span class="hint">tap +1 <kbd>${key[0]}</kbd></span>
		</button>
		${dots(s, side)}
		<button class="btn minus" data-action="point" data-side="${side}" data-delta="-1" ${f.score > 0 ? '' : 'disabled'}>−1 <kbd>${key[1]}</kbd></button>
	</div>`;
}

	</main>`;
}

// --- display view ---

function renderDisplay(s) {
	const live = s.settings.liveScore;
	const side = i => {
		const f = s.fighters[i];
		return `<div class="d-fighter" style="--c:${hex(f.color)}">
			<div class="d-name">${esc(fighterLabel(s, i))}${cardChips(f)}</div>
			${subtitle(f)}
			${live ? `<div class="d-score">${f.score}</div>` : ''}
			${dots(s, i)}
		</div>`;
	};
	return `<main class="display${live ? '' : ' no-score'}" data-action="fullscreen">
		<div class="d-top">
			${divisionHTML(s, 'd-division')}
			${usesRounds(s) ? `<div class="d-round">Round ${s.round}</div>` : ''}

			${(() => { const r = restLeft(s); return r ? `<div class="d-switch">${restNames(s, r)} rest <span data-rest>${restText(r)}</span></div>` : ''; })()}
